name: Deploy Audit Alert Router Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'src/audit-alert-router/**'
      - '.github/workflows/audit-alert-router-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Lambda to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3

      - name: Run Router Smoke Tests
        run: |
          pytest src/audit-alert-router/tests/
          python -c "import sys; sys.path.append('src/audit-alert-router'); import router; assert hasattr(router, 'handler')"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d
        with:
          role-to-assume: arn:aws:iam::493499579600:role/techx-prod-tf2-github-actions-deploy
          aws-region: us-east-1

      - name: Package Lambda Function
        run: |
          cd src/audit-alert-router
          zip -r /tmp/function.zip router.py

      - name: Update Lambda Code and Verify Deployment
        run: |
          aws lambda update-function-code \
            --function-name techx-audit-alert-router \
            --zip-file fileb:///tmp/function.zip
          aws lambda wait function-updated \
            --function-name techx-audit-alert-router
          
          CONF=$(aws lambda get-function-configuration --function-name techx-audit-alert-router --output json)
          HANDLER=$(echo "$CONF" | jq -r '.Handler')
          SHA=$(echo "$CONF" | jq -r '.CodeSha256')
          echo "Deployed Handler: $HANDLER, CodeSha256: $SHA"
          if [ "$HANDLER" != "router.handler" ]; then
            echo "ERROR: Expected handler router.handler, got $HANDLER"
            exit 1
          fi

# Change trail: @hungxqt - 2026-07-29 - Enforce pytest/import smoke test, update wait, and code SHA/handler verification in deployment workflow.
